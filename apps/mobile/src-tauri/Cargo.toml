[package]
name = "streamstein"
version = "0.1.0"
description = "Streamstein mobile - video-first library with spiral search"
authors = ["Steven"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The Android target needs a staticlib + cdylib; the desktop/other targets use rlib.
name = "streamstein_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
